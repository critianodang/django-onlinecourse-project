<!-- Check if user is enrolled to show Exam button/section -->
{% if user.is_authenticated %}
    <div id="exam" class="collapse">
        <div class="card">
            <div class="card-header"><h5>Exam</h5></div>
            <div class="card-body">
                <form id="questionform" action="{% url 'onlinecourse:submit' course.id %}" method="post">
                    {% for question in course.question_set.all %}
                    <div class="card mt-2">
                        <div class="card-header">
                            <h5>{{ question.content }} <span class="badge badge-secondary">{{ question.grade }} Points</span></h5>
                        </div>
                        <div class="card-body">
                            {% csrf_token %}
                            {% for choice in question.choice_set.all %}
                            <div class="form-check">
                                <label class="form-check-label">
                                    <input type="checkbox" name="choice_{{ choice.id }}"
                                           class="form-check-input" id="{{ choice.id }}"
                                           value="{{ choice.id }}">{{ choice.content }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    {% endfor %}
                    <input class="btn btn-success btn-block mt-3" type="submit" value="Submit Exam">
                </form>
            </div>
        </div>
    </div>
{% endif %}
